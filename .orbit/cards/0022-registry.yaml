notes:
- "Catalogue path milestones: M0 = decision 0017 (Data Package as data-description standard); M1 = card 0023 (one real pipeline, brewtrend under examples/); M2 = 3-5 pipelines + settled 'what is an entry' convention; M3 = fetch+run distribution (this card's merged scaffolding, transport finished); M4 = read-only web catalogue (reuse finetype's types-registry pattern); M5 = contribution flywheel (decision 0016)."
- "Open forks before resuming M3+: (1) does `arc registry` survive as a CLI or does the catalogue go web-first with `arc run <fetched>`? (2) Pillar enum (closed, 3 buckets, decision 0015) vs HuggingFace-style free-form tags once contribution opens. (3) where the catalogue lives and who curates."
- "A registry entry is a *pipeline* (yaml+sql), not a Data Package. Per decision 0017 an entry MAY ship a datapackage.json describing its IO so the catalogue can render its schema — but the Data Package describes data, it does not execute."
