id: 2026-04-15-asset-registry
goal: |
  Ship the asset registry layer (v0.2) — auto-discover data assets from SQL via sqlparser-rs, validate dependency ordering before execution, and provide a manifest override mechanism for corrections and command steps. SQL steps should require zero manual asset declarations. This is the semantic layer that makes ArcForm asset-centric rather than just a step runner.
cards: []
status: open
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    SQL steps auto-discover produced assets. Given a SQL file containing CREATE TABLE, CREATE VIEW, or CREATE TABLE AS SELECT, sqlparser-rs extracts the table/view names as assets produced by that step.
  gate: false
  checked: false
  verification: |
    Unit test: parse SQL containing CREATE TABLE foo, CREATE VIEW bar, CREATE TABLE baz AS SELECT. Assert discovered outputs are [foo, bar, baz].
- id: ac-02
  description: |
    SQL steps auto-discover consumed assets. Given a SQL file with FROM and JOIN clauses, sqlparser-rs extracts the referenced table names as assets consumed by that step.
  gate: false
  checked: false
  verification: |
    Unit test: parse SQL containing SELECT ... FROM customers JOIN orders. Assert discovered inputs are [customers, orders].
- id: ac-03
  description: |
    DML statements are recognised as output signals. INSERT INTO and COPY ... TO are treated as the step producing/writing to those assets.
  gate: false
  checked: false
  verification: |
    Unit test: parse SQL containing INSERT INTO summary SELECT ... and COPY customers TO 'file.csv'. Assert discovered outputs include [summary] and the COPY target is handled (at minimum not erroring).
- id: ac-04
  description: |
    Command steps accept optional `produces` and `depends_on` fields in the manifest. These fields explicitly declare what assets the command step produces and consumes, since shell commands cannot be introspected.
  gate: false
  checked: false
  verification: |
    Parse a manifest with a command step having produces: [output_file] and depends_on: [customers]. Assert the step's asset declarations are correctly parsed and included in the dependency graph.
- id: ac-05
  description: |
    A top-level `assets:` section in the manifest allows users to override or augment auto-inferred assets. Each asset entry has a `produced_by` field (step name) and optional `depends_on` (list of asset names). Overrides replace the inferred graph for that asset.
  gate: false
  checked: false
  verification: |
    Unit test: create a manifest with a SQL step that sqlparser infers produces [customers], plus an assets: section that overrides customers to add depends_on: [raw_data]. Assert the final graph includes the override dependency, not just the inferred one.
- id: ac-06
  description: |
    `arc run` validates dependency ordering before executing any steps. If a step reads an asset that is produced by a later step in the declared order, arc exits with a non-zero code and a clear error message naming both the reading step and the producing step.
  gate: false
  checked: false
  verification: |
    Create a manifest where step 1 reads from a table that step 2 creates. `arc run` exits with an error like "step 'X' reads asset 'Y' but 'Y' is produced by step 'Z' which runs after it." No steps execute.
- id: ac-07
  description: |
    When sqlparser-rs cannot parse a SQL file (unsupported DuckDB syntax, extensions, etc.), arc emits a warning to stderr and treats the step as opaque — no assets are inferred. The step still executes normally. The user can add overrides in the assets: section.
  gate: false
  checked: false
  verification: |
    Unit test: feed sqlparser deliberately unparseable SQL. Assert a warning is produced and the step returns empty asset sets (no error). Integration: the step still runs successfully.
- id: ac-08
  description: |
    Manifests without any asset-related fields (no produces, no depends_on, no assets: section) work exactly as v0.1 — no dependency validation, no warnings, identical behaviour. All existing v0.1 tests pass without modification.
  gate: false
  checked: false
  verification: |
    Run the full v0.1 test suite. All 24 tests pass. Additionally, run a v0.1-style manifest (steps only, no assets) through the v0.2 code path and verify identical output.
- id: ac-09
  description: |
    The asset dependency graph correctly handles multi-step chains. Given steps A → B → C where A produces table X, B reads X and produces Y, C reads Y — the graph captures the full chain and validates ordering across all links.
  gate: false
  checked: false
  verification: |
    Unit test: build a 3-step pipeline with chained dependencies. Assert the graph contains edges X→B, Y→C. Reverse the order of steps B and C — assert validation catches the ordering violation.
- id: ac-10
  description: |
    Command steps without explicit produces/depends_on are treated as opaque — they have no assets in the dependency graph. They execute normally but do not participate in dependency validation.
  gate: false
  checked: false
  verification: |
    Create a manifest mixing SQL steps (with discoverable assets) and bare command steps. Assert the command steps appear in the graph with empty asset sets. Dependency validation only applies to steps with known assets.
