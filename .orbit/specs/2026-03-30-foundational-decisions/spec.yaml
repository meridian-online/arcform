id: 2026-03-30-foundational-decisions
goal: |
  Ship ArcForm v0.1 — the step execution foundation of an asset-centric pipeline engine. A Rust CLI (`arc`) that parses a YAML manifest, preflights the engine, and executes SQL and command steps sequentially against DuckDB. This is the execution layer that the asset registry (v0.2) and SQL introspection (v0.2/v0.3) build upon.
cards: []
status: open
labels: []
acceptance_criteria:
- id: ac-1
  description: |
    `arc init` creates a project directory with: arcform.yaml (valid manifest with name, engine, and db fields), models/ directory, and sources/ directory.
  gate: false
  checked: false
  verification: Run `arc init my-project && ls my-project/` — expect arcform.yaml, models/, sources/
- id: ac-2
  description: |
    `arc init` generates a valid arcform.yaml with project name derived from the argument, engine defaulting to 'duckdb', db defaulting to '<name>.duckdb', and steps as an empty list. Empty project names are rejected.
  gate: false
  checked: false
  verification: |
    Parse the generated arcform.yaml — name matches arg, engine is 'duckdb', db is '<name>.duckdb', steps is empty list. `arc init ""` fails.
- id: ac-3
  description: |
    `arc run` parses arcform.yaml, reads the steps list, and executes each step's SQL file against the DuckDB CLI in declared order. All steps share the same database file (specified by the `db` field). The invocation per step is: `duckdb <db_path> -f <sql_file>`.
  gate: false
  checked: false
  verification: |
    Create a 3-step pipeline: step 1 creates a table with a row containing value 'a', step 2 inserts 'b', step 3 inserts 'c'. After `arc run`, query the database and assert rows exist in order (a, b, c). Also verify via CLI output that step names appear in declaration order.
- id: ac-4
  description: |
    `arc run` exits with a non-zero code and clear error message when a SQL step fails (e.g., syntax error, missing table reference). Steps after the failure do not execute.
  gate: false
  checked: false
  verification: |
    Create a 3-step pipeline where step 2 has invalid SQL. `arc run` exits non-zero with the DuckDB error visible. Verify step 3 did not execute (its table does not exist in the database).
- id: ac-5
  description: |
    `arc run` exits with a clear error when: (a) arcform.yaml is missing (run from a directory without one), (b) arcform.yaml is malformed YAML, or (c) a step references a SQL file that doesn't exist. Each case produces a specific, distinct error message.
  gate: false
  checked: false
  verification: |
    Test all three cases. For (a), run `arc run` from /tmp — expect "arcform.yaml not found in current directory". For (b) and (c), create test manifests and verify specific error messages.
- id: ac-6
  description: |
    `arc run` verifies that the declared engine CLI (duckdb) is available and executable before running any steps, by invoking `duckdb --version` and checking for a successful exit code.
  gate: false
  checked: false
  verification: |
    Set PATH to exclude duckdb. `arc run` fails with a clear error message before any SQL runs. Verify no database file is created.
- id: ac-7
  description: |
    SQL files are passed to the DuckDB CLI unmodified — arc does not template, transform, or inject anything into the SQL content.
  gate: false
  checked: false
  verification: |
    Unit test using a mock engine (Engine trait with a MockEngine impl that records the SQL content it receives). Assert the recorded content is byte-identical to the source SQL file.
- id: ac-8
  description: |
    `arc run` on a project with an empty steps list (`steps: []`) exits successfully (code 0) with a message indicating no steps were defined.
  gate: false
  checked: false
  verification: |
    Run `arc run` on a freshly initialised project. Exits 0. Output contains "no steps" or equivalent message.
- id: ac-9
  description: |
    A step with `command:` instead of `sql:` executes the raw command string via shell (`sh -c "<command>"`). The command's exit code determines step success/failure. Engine preflight check is skipped for command steps if no sql steps exist in the manifest.
  gate: false
  checked: false
  verification: |
    Create a manifest with a command step (`command: echo hello`). `arc run` executes it and prints stdout. Create a failing command step (`command: exit 1`). `arc run` exits non-zero.
- id: ac-10
  description: |
    A step with both `sql:` and `command:` (or neither) is rejected during manifest validation with a clear error message before any steps execute.
  gate: false
  checked: false
  verification: |
    Create manifests with: (a) a step having both fields, (b) a step having neither. Both produce a specific validation error naming the offending step.
