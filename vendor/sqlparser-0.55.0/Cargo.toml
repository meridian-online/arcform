# arcform's fork of sqlparser 0.55.0, published as `arcform-sqlparser`. The library
# keeps upstream's name, `sqlparser`, so arcform's source imports it unchanged; the
# licence and authors are upstream's. MERIDIAN_PATCH.md lists what the fork adds.
#
# This manifest began as the normalised one cargo writes into a published crate.
# Upstream's tests, examples and benches are not vendored, so auto-discovery stays
# off; the dev-dependencies serve the unit tests inside src/.

[package]
edition = "2021"
name = "arcform-sqlparser"
version = "0.55.0"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "LICENSE.TXT",
    "README.md",
    "MERIDIAN_PATCH.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "arcform's fork of sqlparser 0.55.0, adding DuckDB grammars the published crate rejects"
homepage = "https://github.com/meridian-online/arcform"
documentation = "https://docs.rs/arcform-sqlparser/"
readme = "README.md"
keywords = [
    "ansi",
    "sql",
    "lexer",
    "parser",
    "duckdb",
]
license = "Apache-2.0"
repository = "https://github.com/meridian-online/arcform"

[package.metadata.docs.rs]
features = [
    "serde",
    "visitor",
]

[features]
default = [
    "std",
    "recursive-protection",
]
json_example = [
    "serde_json",
    "serde",
]
recursive-protection = [
    "std",
    "recursive",
]
std = []
visitor = ["sqlparser_derive"]

[lib]
name = "sqlparser"
path = "src/lib.rs"

[dependencies.bigdecimal]
version = "0.4.1"
features = ["serde"]
optional = true

[dependencies.log]
version = "0.4"

[dependencies.recursive]
version = "0.1.1"
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "alloc",
]
optional = true
default-features = false

[dependencies.serde_json]
version = "1.0"
optional = true

# From crates.io, not vendored: the `visitor` feature's derive macros are upstream's
# unchanged, and they emit `sqlparser::ast::…` paths, which resolve because this
# library keeps the name `sqlparser`.
[dependencies.sqlparser_derive]
version = "0.3.0"
optional = true

[dev-dependencies.matches]
version = "0.1"

[dev-dependencies.pretty_assertions]
version = "1"

[dev-dependencies.simple_logger]
version = "5.0"
