name: with_outputs
db: with_outputs.duckdb
steps:
  - name: parts
    command: |
      mkdir -p build/parts/sub && printf a > build/parts/a.txt && printf b > build/parts/sub/b.txt
      printf c > 'build/parts/ edge .txt'
      nohup sh -c 'while :; do date >> build/noise.txt; sleep 0.1; done' >/dev/null 2>&1 &
  - name: out
    sql: models/out.sql
outputs:
  - build/out.parquet
  - build/parts
