# The `sec.company_tickers_exchange` Protocol — the reproducible *definition* of how the SEC EDGAR
# company-tickers Dataset is ingested from the official SEC file. `arc run` executes
# this manifest; one Run → one Dataset version (the freshness lever). See ./README.md.
#
# MOSTLY-CONFIG. Every step but one is a first-class `sql:` model or a typed `op:`
# operator (the arcform catalog). The exception is named here rather than left for a
# reader to discover: `stamp_descriptor` is a `command:` step. This comment used to say
# there were none, which stopped being true the moment that step landed. The curl fetch
# is http_fetch; the terminal COPY is parquet_export; datapackage_describe emits the
# descriptor from the built Parquet; finetype_validate gates it against the self-derived
# finetype contract. Operator code lives in the arcform repo (engine + catalog), not
# here; this manifest REFERENCES operators by name@version.
#
# BOUNDARY — do NOT fold this into this manifest:
#   • PUBLISH (content-addressed R2 upload + manifest/catalog pointer flip) stays in
#     the out-of-repo publish pipeline and READS this Protocol's terminal output,
#     build/edgar.parquet + the emitted datapackage.json. It is not an arcform step.
#
# INFORMATION RETRIEVAL ONLY — this is a clean IR dataset. The EDGAR ↔ GLEIF
# entity-resolution "join" is NOT done here; it lives in the library.edgar_lei
# Protocol (probabilistic name resolution, published back as a Dataset).
#
# Produces: build/edgar.parquet  →  published as sec.company_tickers_exchange
name: edgar
engine: duckdb
engine_version: ">=1.2"
db: build/edgar.db

# Transient API/network blips shouldn't sink a run — retry fetches with backoff.
defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: the SEC's company_tickers_exchange.json ───────────────────────────────
  # http_fetch carries the content-freshness contract (ETag/Last-Modified in a sidecar
  # → conditional re-fetch), so an unchanged upstream is a 304, not a re-download. The
  # SEC requires a User-Agent carrying contact info.
  - name: fetch_edgar
    op: http_fetch@1
    with:
      url: https://www.sec.gov/files/company_tickers_exchange.json
      out: build/edgar.json
      headers:
        User-Agent: "Meridian Protocol (open-analytics; research@meridian.online)"

  # ── Load + normalise: flatten the columnar {fields, data} JSON to the 4-field schema ─
  - name: load
    sql: models/load.sql
    depends_on: [build/edgar.json]

  # ── Package: materialise the terminal table (adds the search corpus) ─────────────
  - name: package
    sql: models/package.sql
    produces: [edgar_out]

  # ── Export: write the terminal Parquet the publish seam consumes ─────────────────
  # parquet_export replaces package.sql's old `COPY … (COMPRESSION zstd)` — a first-class
  # produced asset the engine orders + stale-propagates, not a graph island. The TOTAL
  # order_by (company_name has ties across cik/ticker) makes the bytes reproducible.
  - name: export_edgar
    op: parquet_export@1
    with:
      input: edgar_out
      dest: build/edgar.parquet
      compression: zstd
      order_by: "company_name, cik, ticker"

  # ── Describe: EMIT datapackage.json from the built Parquet ───────────────────────
  # datapackage_describe types every column nominations.finetype.json does not declare
  # with finetype (`profile … -o datapackage`)
  # and overlays descriptor.overrides.json (identity, licenses, sources, per-field prose,
  # primaryKey). Hard-fails if a curated key names a column absent from the Parquet.
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/edgar.parquet
      overrides: descriptor.overrides.json
      # The columns whose type is declared rather than inferred. finetype takes each one
      # as given, carries its label's bounds, marks it x-finetype-nominated and states no
      # confidence for it; the file says why each was declared.
      nominations: nominations.finetype.json
      out: datapackage.json

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ──
  # finetype_validate makes finetype LOAD-BEARING, not just descriptive: `finetype
  # validate` (CHECK-ONLY) types every column and checks the terminal Parquet against
  # schema.finetype.json. That contract is self-derived from THIS Parquet (finetype
  # profile -o json-schema --stats, relaxed to the observable envelope — see the schema's
  # $comment), so every current row passes: a pass-through today, a fail-closed DRIFT
  # tripwire for future Runs. CHECK-ONLY writes nothing, so build/edgar.parquet stays
  # byte-identical — this step READS the output.
  - name: validate
    op: finetype_validate@1
    with:
      parquet: build/edgar.parquet
      schema: schema.finetype.json
  # ── Self-describe: put the descriptor INSIDE the Parquet it describes ───────────
  # Someone holding https://openlake.meridian.online/sec/company_tickers_exchange.parquet
  # cannot find the datapackage.json that describes it: it is a second file, in a
  # source repository they have no reason to know exists, and behind an authenticating
  # edge there is no repository to find. This step writes the finished descriptor into
  # the file's own Parquet footer, so the object answers for itself from its URL alone:
  #   SELECT decode(value) FROM parquet_kv_metadata('<url>')
  #    WHERE decode(key) = 'datapackage.json';
  #
  # It runs LAST because it embeds the FINISHED descriptor, and it re-measures the
  # resource `bytes` and `hash` because stamping lengthens the file past the figures
  # describe took off the unstamped build.
  #
  # It is NOT a field on parquet_export above. That operator's `metadata:` values are
  # literal strings in this manifest, and the descriptor does not exist until describe
  # has read the very Parquet that would have to carry it.
  #
  # The embedded copy omits the resource `bytes` and `hash`, and the package's
  # `created`: a file cannot state its own size, because writing the value changes it,
  # and a write time moves on a publish that changed nothing else. Those stay in
  # datapackage.json, measured against the finished object; check_descriptors.py holds
  # the two copies to each other.
  #
  # Everything before the footer is compared byte for byte, so the order_by above still
  # decides the data bytes and a stamp that moved one is refused with the original left
  # in place. Re-running the step is a no-op to the byte.
  - name: stamp_descriptor
    command: "python3 ../../scripts/stamp_descriptor.py stamp --descriptor datapackage.json --parquet build/edgar.parquet"

  # publish: the out-of-repo publish pipeline reads build/edgar.parquet + the emitted
  # datapackage.json (boundary — not an arc step). See README.
