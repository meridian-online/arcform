# The `gleif.lei` Protocol — the reproducible *definition* of how the GLEIF Legal
# Entity Identifier Dataset is ingested from the official GLEIF golden copy. `arc run`
# executes this manifest; one Run → one Dataset version (the freshness lever). See
# ./README.md (the Protocol primitive).
#
# MOSTLY-CONFIG. The terminal COPY is now parquet_export; datapackage_describe emits the
# descriptor from the built Parquet. Three steps are `command:` rather than typed
# operators and are named here rather than left to be discovered: `fetch_gleif` (see its
# note below), `stamp_version` and `stamp_descriptor`. The finetype_validate drift gate is DEFERRED until
# the first full-scale Run exists to derive its contract from — see the validate note at
# the tail of this manifest. The FETCH is still an opaque `command:` step by design — see its
# note: the golden copy is republished DAILY and its URL is resolved at run time from a
# JSON API (not an HTML index), so it is neither a stable pinnable URL nor an
# html_link_discover target; and it is a ~470 MB zip. Converting it to typed operators
# would misrepresent a JSON-API lookup as link discovery and buy nothing, so the fetch
# stays a script. Everything downstream of the raw CSV is first-class config.
#
# BOUNDARY — do NOT fold this into this manifest:
#   • PUBLISH (content-addressed R2 upload + manifest/catalog pointer flip) stays in
#     the out-of-repo publish pipeline and READS this Protocol's terminal output,
#     build/gleif.parquet + the emitted datapackage.json. It is not an arcform step.
#
# Produces: build/gleif.parquet  →  published as gleif.lei
name: gleif
engine: duckdb
engine_version: ">=1.2"
db: build/gleif.db

# Transient API/network blips shouldn't sink a run — retry fetches with backoff.
defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: resolve the latest golden-copy full CSV, download (~470 MB zip), unzip ─
  # OPAQUE BY DESIGN (see the manifest header): the helper resolves the current
  # full-file CSV URL from the GLEIF publishes JSON API, then downloads + unzips it. The
  # golden copy is republished daily — the URL is not stable and not an html href — so
  # this is left as a script rather than forced into http_fetch/html_link_discover.
  - name: fetch_gleif
    command: "bash scripts/fetch_gleif.sh build/gleif_src"
    produces: [gleif_raw]
    preconditions:
      - modified_after: { path: build/gleif_src, period: 24h }

  # ── Load + normalise: the published 10-field schema (dates sliced from ISO ts) ───
  - name: load
    sql: models/load.sql
    depends_on: [gleif_raw]

  # ── Package: materialise the terminal table (adds the search corpus) ─────────────
  - name: package
    sql: models/package.sql
    produces: [gleif_out]

  # ── Export: write the terminal Parquet the publish seam consumes ─────────────────
  # parquet_export replaces package.sql's old `COPY … (COMPRESSION zstd)` — a first-class
  # produced asset the engine orders + stale-propagates. The TOTAL order_by (lei is
  # unique) makes the bytes reproducible for a given golden-copy snapshot.
  - name: export_gleif
    op: parquet_export@1
    with:
      input: gleif_out
      dest: build/gleif.parquet
      compression: zstd
      order_by: "country, legal_name, lei"

  # ── Describe: EMIT datapackage.json from the built Parquet ───────────────────────
  # finetype types every column nominations.finetype.json does not declare;
  # descriptor.overrides.json overlays the curated half
  # (identity, licenses, sources, per-field prose, primaryKey). Hard-fails on drift.
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/gleif.parquet
      overrides: descriptor.overrides.json
      # The columns whose type is declared rather than inferred. finetype takes each one
      # as given, carries its label's bounds, marks it x-finetype-nominated and states no
      # confidence for it; the file says why each was declared.
      nominations: nominations.finetype.json
      out: datapackage.json

  # ── Stamp: record WHICH finetype produced the descriptor ─────────────────────────
  # datapackage_describe asserts a FLOOR version but writes nothing about the binary it
  # actually ran, so a descriptor generated by a superseded finetype reads exactly like a
  # current one. This step resolves `finetype` on PATH and writes its version into the
  # descriptor as the package-level `x-finetype-version`. It is derived at run time
  # rather than checked in as a literal, because a literal records what someone believed
  # when they typed it — which is the claim that cannot be trusted here.
  - name: stamp_version
    command: "python3 ../../scripts/stamp_finetype_version.py --descriptor datapackage.json"
  # ── Self-describe: put the descriptor INSIDE the Parquet it describes ───────────
  # Someone holding https://openlake.meridian.online/gleif/lei.parquet
  # cannot find the datapackage.json that describes it: it is a second file, in a
  # source repository they have no reason to know exists, and behind an authenticating
  # edge there is no repository to find. This step writes the finished descriptor into
  # the file's own Parquet footer, so the object answers for itself from its URL alone:
  #   SELECT decode(value) FROM parquet_kv_metadata('<url>')
  #    WHERE decode(key) = 'datapackage.json';
  #
  # It runs LAST because it embeds the FINISHED descriptor, and it re-measures the
  # resource `bytes` and `hash` because stamping lengthens the file past the figures
  # describe took off the unstamped build.
  #
  # It is NOT a field on parquet_export above. That operator's `metadata:` values are
  # literal strings in this manifest, and the descriptor does not exist until describe
  # has read the very Parquet that would have to carry it.
  #
  # The embedded copy omits the resource `bytes` and `hash`, and the package's
  # `created`: a file cannot state its own size, because writing the value changes it,
  # and a write time moves on a publish that changed nothing else. Those stay in
  # datapackage.json, measured against the finished object; check_descriptors.py holds
  # the two copies to each other.
  #
  # Everything before the footer is compared byte for byte, so the order_by above still
  # decides the data bytes and a stamp that moved one is refused with the original left
  # in place. Re-running the step is a no-op to the byte.
  - name: stamp_descriptor
    command: "python3 ../../scripts/stamp_descriptor.py stamp --descriptor datapackage.json --parquet build/gleif.parquet"

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ──
  # DEFERRED — NO validate step yet, on purpose. The finetype_validate@1 gate needs a
  # checked-in schema.finetype.json derived from THIS dataset's own Parquet, and that
  # Parquet does not exist yet: deriving it needs the ~470 MB golden-copy, and the GLEIF
  # download is bandwidth-throttled (~100 KB/s) where this was built, so the first
  # full-scale Run has not completed. Wiring the gate against a non-existent schema hard-
  # fails every `arc run` at validate, so the step is intentionally omitted until then —
  # not left dangling. On the first successful Run, derive the contract from the built
  # Parquet with the same string-surviving keyword discipline as edgar / naics /
  # edgar_gleif (type:string + enum/pattern/minLength/maxLength; see any of their
  # schema.finetype.json $comment for the enforce-vs-inert rules), commit it as
  # schema.finetype.json, then add the validate step here:
  #   - name: validate
  #     op: finetype_validate@1
  #     with:
  #       parquet: build/gleif.parquet
  #       schema: schema.finetype.json

  # publish: the out-of-repo publish pipeline reads build/gleif.parquet + the emitted
  # datapackage.json (boundary — not an arc step). See README.
