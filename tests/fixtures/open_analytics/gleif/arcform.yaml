# The `gleif.lei` Protocol — the reproducible *definition* of how the GLEIF Legal
# Entity Identifier Dataset is ingested from the official GLEIF golden copy. `arc run`
# executes this manifest; one Run → one Dataset version (the freshness lever). See
# ./README.md (the Protocol primitive).
#
# MOSTLY-CONFIG. The terminal COPY is now parquet_export; datapackage_describe emits the
# descriptor from the built Parquet. Two steps are `command:` rather than typed
# operators and are named here rather than left to be discovered: `fetch_gleif` (see its
# note below) and `stamp_version`; `stamp_descriptor` runs through `op: uv@1`. The finetype_validate drift gate is DEFERRED until
# the first full-scale Run exists to derive its contract from — see the validate note at
# the tail of this manifest. The FETCH is still an opaque `command:` step by design — see its
# note: the golden copy is republished DAILY and its URL is resolved at run time from a
# JSON API (not an HTML index), so it is neither a stable pinnable URL nor an
# html_link_discover target; and it is a ~470 MB zip. Converting it to typed operators
# would misrepresent a JSON-API lookup as link discovery and buy nothing, so the fetch
# stays a script. Everything downstream of the raw CSV is first-class config.
#
# PUBLISH. The last step, `publish` (ducklake_write), writes the table into the shared
# open lake as one snapshot: the catalog, the data file, the table's readable Parquet
# copy and the search index on R2 (public at https://openlake.meridian.online/). With
# all three R2 variables set, from .env or the environment, EVERY `arc run` publishes
# into the live lake; `arc run --publish` only makes a missing credential fail the run
# instead of publishing into build/lake/. For local work keep .env absent and the
# variables unset. Keep the credential outside this folder and export it for the
# publishing command only. Readers need DuckDB 2.0 or later. It reads only what
# stamp_descriptor and export_search wrote, so it runs after them.
#
# Produces: build/gleif.parquet  →  published as gleif.lei
#           build/gleif_search.parquet  →  its search index, gleif/lei/search.parquet
name: gleif
engine: duckdb
# Kept in step with ../soc_2018, which pins the DuckDB that arc links (2.0), the writer of its published Parquet.
engine_version: ">=2.0"
db: build/gleif.db
# The R2 write credential, if a .env is present (see .env.example); the process environment also counts.
dotenv: [.env]

# Transient API/network blips shouldn't sink a run — retry fetches with backoff.
defaults:
  retry:
    max_attempts: 3
    backoff_sec: 2.0

steps:
  # ── Fetch: resolve the latest golden-copy full CSV, download (~470 MB zip), unzip ─
  # OPAQUE BY DESIGN (see the manifest header): the helper resolves the current
  # full-file CSV URL from the GLEIF publishes JSON API, then downloads + unzips it. The
  # golden copy is republished daily — the URL is not stable and not an html href — so
  # this is left as a script rather than forced into http_fetch/html_link_discover.
  - name: fetch_gleif
    command: "bash scripts/fetch_gleif.sh build/gleif_src"
    produces: [gleif_raw]
    preconditions:
      - modified_after: { path: build/gleif_src, period: 24h }

  # ── Load + normalise: the published 10-field schema (dates sliced from ISO ts) ───
  - name: load
    sql: models/load.sql
    depends_on: [gleif_raw]

  # ── Package: materialise the terminal table (adds the search corpus) ─────────────
  - name: package
    sql: models/package.sql
    produces: [gleif_out]

  # ── Export: write the terminal Parquet the publish seam consumes ─────────────────
  # parquet_export replaces package.sql's old `COPY … (COMPRESSION zstd)` — a first-class
  # produced asset the engine orders + stale-propagates. The TOTAL order_by (lei is
  # unique) makes the bytes reproducible for a given golden-copy snapshot.
  - name: export_gleif
    op: parquet_export@1
    with:
      input: gleif_out
      dest: build/gleif.parquet
      compression: zstd
      order_by: "country, legal_name, lei"

  # ── Describe: EMIT build/datapackage.json from the built Parquet ─────────────────
  # finetype types every column nominations.finetype.json does not declare;
  # descriptor.overrides.json overlays the curated half
  # (identity, licenses, sources, per-field prose, primaryKey). Hard-fails on drift.
  - name: describe
    op: datapackage_describe@1
    with:
      parquet: build/gleif.parquet
      overrides: descriptor.overrides.json
      # The columns whose type is declared rather than inferred. finetype takes each one
      # as given, carries its label's bounds, marks it x-finetype-nominated and states no
      # confidence for it; the file says why each was declared.
      nominations: nominations.finetype.json
      out: build/datapackage.json

  # ── Stamp: record WHICH finetype produced the descriptor ─────────────────────────
  # datapackage_describe asserts a FLOOR version but writes nothing about the binary it
  # actually ran, so a descriptor generated by a superseded finetype reads exactly like a
  # current one. This step resolves `finetype` on PATH and writes its version into the
  # descriptor as the package-level `x-finetype-version`. It is derived at run time
  # rather than checked in as a literal, because a literal records what someone believed
  # when they typed it — which is the claim that cannot be trusted here.
  - name: stamp_version
    command: "python3 ../../scripts/stamp_finetype_version.py --descriptor build/datapackage.json"

  # ── Lake: every published table's descriptor, as the open lake holds it ─────────
  # The repository commits no descriptor: the lake's meta.descriptors and manifest.json
  # hold the one stored copy, and emit_descriptor.py joins the two back into each
  # table's full descriptor and writes them all to one bundle, table name to descriptor.
  # It runs before the stamp, which keeps the lake's `created` when it writes the object
  # the lake already serves; the check before publish compares this build against it. It
  # reads the public catalogue and manifest, with no credential, and declares both as
  # remote reads, so arc runs it on every run. One file, so `arc test` can fixture this
  # step by name.
  # `shasum -a 256 scripts/emit_descriptor.py` prints the digest.
  - name: emit_descriptors
    op: uv@1
    with:
      script: ../../scripts/emit_descriptor.py
      sha256: 897e2c94fc2c51187f852f595d8bd61a04308ecac6a35a2f28e57c1183e2aaec
      deps:
        - duckdb==2.0.0
        - pyyaml==6.0.3
      args:
        - --all
        - --bundle
        - build/lake_descriptors.json
      # The tables it emits are the ones every Protocol's publish step names.
      reads:
        - https://openlake.meridian.online/catalog/open.ducklake
        - https://openlake.meridian.online/manifest.json
        - ../../datasets/*/arcform.yaml
      produces:
        - build/lake_descriptors.json

  # ── Self-describe: put the descriptor INSIDE the Parquet it describes ───────────
  # Someone holding https://openlake.meridian.online/gleif/lei.parquet
  # cannot find the datapackage.json that describes it: it is a second record, in a
  # catalogue they have no reason to know exists. This step writes the finished
  # descriptor into the file's own Parquet footer, so the object answers for itself
  # from its URL alone:
  #   SELECT decode(value) FROM parquet_kv_metadata('<url>')
  #    WHERE decode(key) = 'datapackage.json';
  #
  # It is the last step that shapes the descriptor, because it embeds the FINISHED
  # descriptor; only the checks before publish follow it. It re-measures the
  # resource `bytes` and `hash` because stamping lengthens the file past the figures
  # describe took off the unstamped build.
  #
  # It is NOT a field on parquet_export above. That operator's `metadata:` values are
  # literal strings in this manifest, and the descriptor does not exist until describe
  # has read the very Parquet that would have to carry it.
  #
  # The embedded copy omits the resource `bytes` and `hash`, and the package's
  # `created`: a file cannot state its own size, because writing the value changes it,
  # and a write time moves on a publish that changed nothing else. Those stay in
  # build/datapackage.json, which publish stores in the lake, measured against the
  # finished object; check_descriptors.py holds the two copies to each other.
  #
  # Everything before the footer is compared byte for byte, so the order_by above still
  # decides the data bytes and a stamp that moved one is refused with the original left
  # in place. Re-running the step is a no-op to the byte.
  #
  # `--carry-created-from` keeps the `created` the lake's copy states when the stamped
  # file is the object the lake already serves; anything else, a first publish included,
  # takes the one `describe` wrote.
  #
  # `op: uv@1` rather than a bare `python3`: the readback imports duckdb, and a
  # `python3` without it failed the step. uv resolves the interpreter and the package
  # itself. It rewrites, in place, the Parquet `export_gleif` wrote and the
  # build/datapackage.json `describe` wrote, so each of those files has two writers; giving
  # each one writer, as edgar_gleif and the code lists do, is a separate restructure.
  - name: stamp_descriptor
    op: uv@1
    with:
      script: ../../scripts/stamp_descriptor.py
      # `shasum -a 256 scripts/stamp_descriptor.py` prints this.
      sha256: c36284fd200d76a6e5f3da9e3051a9dd8fe057df99603ed80e79043ef6dbb5a1
      # Pinned to the DuckDB that engine_version names. The stamp
      # rewrites no data page, so this need not be the DuckDB that wrote the Parquet.
      deps:
        - duckdb==2.0.0
      args:
        - stamp
        - --carry-created-from
        - build/lake_descriptors.json
        - --table
        - gleif.lei
        - --descriptor
        - build/datapackage.json
        - --parquet
        - build/gleif.parquet
      reads:
        - build/lake_descriptors.json
        - build/datapackage.json
        - build/gleif.parquet
      produces:
        - build/datapackage.json
        - build/gleif.parquet

  # ── Validate: GATE the built Parquet against the self-derived finetype contract ──
  # DEFERRED — NO validate step yet, on purpose. The finetype_validate@1 gate needs a
  # checked-in schema.finetype.json derived from THIS dataset's own Parquet, and that
  # Parquet does not exist yet: deriving it needs the ~470 MB golden-copy, and the GLEIF
  # download is bandwidth-throttled (~100 KB/s) where this was built, so the first
  # full-scale Run has not completed. Wiring the gate against a non-existent schema hard-
  # fails every `arc run` at validate, so the step is intentionally omitted until then —
  # not left dangling. On the first successful Run, derive the contract from the built
  # Parquet with the same string-surviving keyword discipline as edgar / naics /
  # edgar_gleif (type:string + enum/pattern/minLength/maxLength; see any of their
  # schema.finetype.json $comment for the enforce-vs-inert rules), commit it as
  # schema.finetype.json, then add the validate step here:
  #   - name: validate
  #     op: finetype_validate@1
  #     with:
  #       parquet: build/gleif.parquet
  #       schema: schema.finetype.json

  # ── Search index: word token → entity, for the website's typeahead ─────────────
  # Built from the terminal table, so it describes the same golden-copy snapshot. It is
  # not a table in the lake: it is an extra file the publish step uploads, and the
  # compatible manifest names it as the entry's searchUrls, which the website reads.
  - name: search
    sql: models/search.sql
    produces: [gleif_search]

  # Sorted by token with 20,000-row groups, so a prefix range scan prunes to about one
  # group. (token, lei) is unique, so the order is total and the bytes reproducible.
  - name: export_search
    op: parquet_export@1
    with:
      input: gleif_search
      dest: build/gleif_search.parquet
      compression: zstd
      row_group_size: 20000
      order_by: "token, lei"

  # ── Check: the built table against the lake, before it is published ─────────────
  # check_before_publish.py runs four checks on this build. Three read the lake too:
  # label agreement (strict, on what involves this table) against every other table's
  # descriptor in the bundle, the frictionless reference implementation over the built
  # descriptor, and check_descriptors.py's rules read against the local Parquet. The
  # fourth holds the build to the committed overrides. A failing check fails
  # the run, so publish never runs. Each built descriptor keeps the path it is published
  # at; the script reads the bytes from the local Parquet instead. It imports its
  # sibling checks in-process and the digest pins only its own bytes, so those scripts
  # are reads too: editing one makes this step stale.
  # `shasum -a 256 scripts/check_before_publish.py` prints the digest.
  - name: check_before_publish
    op: uv@1
    with:
      script: ../../scripts/check_before_publish.py
      sha256: 53bd12b2ba03901deea8a9d559764639557ca5b7539567d10abda6b0a62e99a5
      deps:
        - duckdb==2.0.0
        - pyyaml==6.0.3
        - frictionless==5.19.0
      args:
        - --datasets-dir
        - ../../datasets
        - --slug
        - gleif
        - --lake-bundle
        - build/lake_descriptors.json
        - --built
        - build/datapackage.json=build/gleif.parquet
        - --json
        - build/check_before_publish.json
      reads:
        - build/lake_descriptors.json
        - build/datapackage.json
        - build/gleif.parquet
        - ../../datasets/*/arcform.yaml
        - ../../datasets/label-agreement.json
        - ../../datasets/frictionless-rejections.json
        - ../../datasets/licence-notices.json
        - ../../scripts/check_descriptors.py
        - ../../scripts/check_constraint_ratchet.py
        - ../../scripts/check_frictionless.py
        - ../../scripts/check_label_agreement.py
        - ../../scripts/emit_descriptor.py
        - ../../scripts/stamp_descriptor.py
      produces:
        - build/check_before_publish.json

  # ── Publish: upsert the table into the open lake on lei, with its search index ───
  # One snapshot: entities the golden copy adds are inserted, changed rows updated, and
  # entities it no longer carries deleted. The descriptor goes into the lake's meta
  # schema, the readable copy to the fixed key gleif/lei.parquet, and the search index
  # to gleif/lei/search.parquet, uploaded only after the catalogue holds the snapshot.
  # Without the credential it publishes into build/lake/open.ducklake and the run stays
  # green.
  - name: publish
    op: ducklake_write@1
    with:
      public_base: https://openlake.meridian.online/
      catalog: catalog/open.ducklake
      data_path: lake/
      runs: runs/
      manifest: manifest.json
      local_catalog: build/lake/open.ducklake
      # on_descriptor_change: fail refuses the publish, writing nothing, when a field's FineType
      # label moved against the descriptor the lake holds and the field is not nominated;
      # every other difference is reported.
      tables:
        - table: gleif.lei
          from: build/gleif.parquet
          descriptor: build/datapackage.json
          on_descriptor_change: fail
          readable_copy: gleif/lei.parquet
          manifest_extra:
            searchUrls:
              - https://openlake.meridian.online/gleif/lei/search.parquet
      files:
        - from: build/gleif_search.parquet
          to: gleif/lei/search.parquet
      credential:
        type: r2
        bucket: meridian-open
        env:
          key_id: R2_ACCESS_KEY_ID
          secret: R2_SECRET_ACCESS_KEY
          account_id: R2_ACCOUNT_ID
