# Fixture Protocol for the text_embed operator, and for the chain it exists to make
# possible.
#
# Four steps, and the last two are the point: load a small two-subject corpus, export
# it as Parquet, turn its `description` column into a VECTOR column, and only then
# reduce that vector column to the two coordinates a map needs.
#
# THE TWO ARE SEPARATE STEPS AND THAT IS THE PROPERTY UNDER TEST.
# `build/corpus_embedded.parquet` is a finished artifact: an analyst who wants vectors
# for similarity, clustering, deduplication or classifier features stops there and
# never runs the projection. An analyst who wants a map runs both. Neither is
# reachable only through the other, which is what a single merged step made
# impossible.
#
# `umap_project` is not told that an embedding produced its input — it is handed a
# numeric column like any other. `metric: cosine` is the one thing the Protocol says
# about it, because an L2-normalised vector is a direction and cosine is how you
# measure the angle between two of them.
#
# THE MODEL IS COMMITTED BESIDE THIS FILE, in ./model, and is declared as an input to
# the embedding step — which is the other property under test: the model is a node in
# the graph rather than a download the step performs, and a model that is not there
# stops the run naming the file it looked for.
#
# Model fetch steps for a real Protocol: see operators/text_embed/README.md.
#
# The committed model is a TINY stand-in generated by ./make_fixture_model.py over
# this corpus's own vocabulary — same layout as a real release (one [vocab, dim]
# float tensor under `embeddings`, beside a tokenizer.json), 16 dimensions instead of
# 256, so the fixture is kilobytes rather than tens of megabytes.
name: text_embed_fixture
engine: duckdb
db: build/fixture.duckdb

steps:
  - name: load_corpus
    sql: models/corpus.sql

  - name: export_corpus
    op: parquet_export@1
    with:
      input: corpus
      dest: build/corpus.parquet
      order_by: "id"

  - name: embed
    op: text_embed@1
    with:
      input: build/corpus.parquet
      text_column: description
      model: model
      out: build/corpus_embedded.parquet

  - name: project
    op: umap_project@1
    with:
      input: build/corpus_embedded.parquet
      columns: [embedding]
      out: build/corpus_projected.parquet
      metric: cosine
