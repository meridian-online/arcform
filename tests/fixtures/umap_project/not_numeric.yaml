# A variant of arcform.yaml that asks the projection to place a VARCHAR column on a
# map. Staged over arcform.yaml by
# `a_column_that_is_not_a_number_is_refused_naming_the_column_and_its_type`.
#
# Which columns exist and what type they are is not decidable from a manifest, so this
# refusal cannot be a load-time one — it is the script's, and it has to name both the
# column and the type it found rather than failing somewhere inside UMAP.
name: umap_project_not_numeric
engine: duckdb
db: build/fixture.duckdb

steps:
  - name: load_homes
    sql: models/homes.sql

  - name: export_homes
    op: parquet_export@1
    with:
      input: homes
      dest: build/homes.parquet
      order_by: "id"

  - name: project
    op: umap_project@1
    with:
      input: build/homes.parquet
      columns: [longitude, district]
      out: build/homes_projected.parquet
