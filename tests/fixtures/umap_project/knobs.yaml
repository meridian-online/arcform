# A variant of arcform.yaml that projects the SAME columns of the SAME table four
# times, changing one documented knob each time. Staged over arcform.yaml by
# `the_knobs_a_manifest_sets_change_the_map_not_just_the_argv`.
#
# It exists because asserting that `--neighbors` reaches the argv is not the same as
# asserting that setting `neighbors:` changes anything. A script that accepted the flag
# and then projected with its own default would satisfy the first and quietly hand a
# Protocol author the wrong map. So the test compares BYTES across these four outputs:
# each knob has to move them.
#
# Kept separate from arcform.yaml rather than folded into it: every other end-to-end
# test runs the whole Protocol, and four projections where one is needed would
# quadruple them all.
name: umap_project_knobs
engine: duckdb
db: build/fixture.duckdb

steps:
  - name: load_homes
    sql: models/homes.sql

  - name: export_homes
    op: parquet_export@1
    with:
      input: homes
      dest: build/homes.parquet
      order_by: "id"

  # No knob set: the script's own defaults (15 neighbours, min_dist 0.1, euclidean)
  # stand. This is also the only place the omitted-argv path is exercised end to end.
  - name: project_default
    op: umap_project@1
    with:
      input: build/homes.parquet
      columns: [longitude, latitude, median_income, rooms_per_household]
      out: build/default.parquet

  # Only `neighbors` moves — 40 of the table's 48 rows, so each point is placed
  # against most of the whole rather than its own locality.
  - name: project_more_neighbours
    op: umap_project@1
    with:
      input: build/homes.parquet
      columns: [longitude, latitude, median_income, rooms_per_household]
      out: build/more_neighbours.parquet
      neighbors: 40

  # Only `min_dist` moves — 0.9 against the default 0.1, so points are held far apart
  # instead of being allowed to pack.
  - name: project_looser_packing
    op: umap_project@1
    with:
      input: build/homes.parquet
      columns: [longitude, latitude, median_income, rooms_per_household]
      out: build/looser_packing.parquet
      min_dist: 0.9

  # Only `metric` moves — cosine reads each row as a direction rather than a position,
  # which is the wrong reading of a longitude but the right one for a normalised
  # vector. The point here is only that the field reaches the layout.
  - name: project_cosine
    op: umap_project@1
    with:
      input: build/homes.parquet
      columns: [longitude, latitude, median_income, rooms_per_household]
      out: build/cosine.parquet
      metric: cosine
