# Fixture Protocol for the embed_project operator.
#
# Three steps, and the third is the one under test: load a small two-subject corpus,
# export it as Parquet, then turn its `description` column into the two coordinates a
# map needs.
#
# THE MODEL IS COMMITTED BESIDE THIS FILE, in ./model, and is declared as an input to
# the step. A real Protocol fetches a published model2vec/potion release with the
# operators it already has —
#
#   - name: fetch_model
#     op: http_fetch@1
#     with: { url: https://…/potion-base-8M.tar.gz, out: build/model.tar.gz }
#   - name: unpack_model
#     op: archive_extract@1
#     with: { archive: build/model.tar.gz, dest: models/potion-base-8M }
#
# — and points `model:` at what that produced. Either way the model is a node in the
# graph rather than a download the step performs, which is the property under test:
# the projection is downstream of the model, and a model that is not there stops the
# run naming the file it looked for.
#
# The committed model is a TINY stand-in generated by ./make_fixture_model.py over
# this corpus's own vocabulary — same layout as a real release (one [vocab, dim]
# float tensor under `embeddings`, beside a tokenizer.json), 16 dimensions instead of
# 256, so the fixture is kilobytes rather than tens of megabytes.
name: embed_project_fixture
engine: duckdb
db: build/fixture.duckdb

steps:
  - name: load_corpus
    sql: models/corpus.sql

  - name: export_corpus
    op: parquet_export@1
    with:
      input: corpus
      dest: build/corpus.parquet
      order_by: "id"

  - name: project
    op: embed_project@1
    with:
      input: build/corpus.parquet
      text_column: description
      model: model
      out: build/corpus_projected.parquet
