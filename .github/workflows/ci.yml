name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — the newest push is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # arcform links a SYSTEM DuckDB — `libduckdb-sys` ships no `bundled` feature, so
  # every job that compiles the crate must provide the C library and its headers.
  # Pinned to the version the crate is developed against; bump in lockstep with the
  # `duckdb` dependency. The install step below writes the *_DIR / LD_LIBRARY_PATH
  # env vars that libduckdb-sys and the test runtime read.
  DUCKDB_VERSION: v1.5.4

jobs:
  # Formatting is build-free, so it reports in seconds and never waits on the
  # DuckDB download or a compile.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain: clippy's lint set moves between releases, so an
      # unpinned rustc could turn the gate red on a commit that changed nothing.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all --check

  # The Python operator scripts are shelled out to at run time, so `cargo test`
  # never executes a line of them — their own tests have to be run explicitly or
  # they are dead weight. Build-free like `fmt`, and stdlib-only (each script
  # declares `dependencies = []`), so the runner's own Python is enough: no
  # setup-python, no uv, no install step, seconds to report.
  operators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # umap_project.py runs under `uv` with umap-learn, numpy and DuckDB — none of
      # which this runner has, and the end-to-end tests that would exercise it skip
      # here for exactly that reason. So the script imports those three INSIDE
      # `main()`, and the half above them that decides things — which column types can
      # be placed on a map, how many features each contributes, the SQL quoting — is
      # importable and tested with the standard library alone. Without this step every
      # line of that script is invisible to CI.
      - name: umap_project tests
        run: python3 operators/umap_project/test_umap_project.py
      # Stdlib-only, same reason as the step above: results.json is committed, and
      # nothing else re-checks that operators/umap_project/README.md and
      # CHANGELOG.md still say what it says. Without this, a re-run of
      # eval/map-refit-stability/measure.py that changes results.json and a prose
      # edit that does not both look clean.
      - name: map-refit-stability findings match results.json
        run: python3 eval/map-refit-stability/check_findings.py

  # Clippy and the test suite both compile the crate against system DuckDB, so
  # they share a job that provisions the library once.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Fetch the official DuckDB C library (libduckdb.so + duckdb.h/.hpp) and
      # point the linker, the bindings build script, and the test runtime at it.
      # AND the `duckdb` CLI: arc's engine shells out to the `duckdb` binary to
      # execute a protocol's steps, so the init_from_descriptor integration test
      # (which does a real `arc run`) needs the executable on PATH — the library
      # alone links the bindings but cannot run a protocol.
      - name: Install DuckDB (C library + CLI)
        run: |
          set -euo pipefail
          base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"
          mkdir -p "$HOME/duckdb"
          curl -fsSL -o /tmp/libduckdb.zip "$base/libduckdb-linux-amd64.zip"
          unzip -o /tmp/libduckdb.zip -d "$HOME/duckdb"
          curl -fsSL -o /tmp/duckdb-cli.zip "$base/duckdb_cli-linux-amd64.zip"
          unzip -o /tmp/duckdb-cli.zip -d "$HOME/duckdb"
          chmod +x "$HOME/duckdb/duckdb"
          "$HOME/duckdb/duckdb" --version
          {
            echo "DUCKDB_LIB_DIR=$HOME/duckdb"
            echo "DUCKDB_INCLUDE_DIR=$HOME/duckdb"
            echo "LD_LIBRARY_PATH=$HOME/duckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          echo "$HOME/duckdb" >> "$GITHUB_PATH"

      # Stage the PUBLISHED finetype DuckDB extension. Without it the
      # `finetype_validate` tests — the ones that drive a real refusal and read the
      # message it hands the operator — return early and report as `ok`, which is
      # indistinguishable from having run. This is one `INSTALL ... FROM community`
      # of a ~14 MB artifact, not a second repo's build, so it belongs on the routine
      # gate rather than in a scheduled workflow the way `staticembed` does.
      #
      # `test -f` makes a registry that served nothing a red step here rather than a
      # silent skip three steps later, and `ARCFORM_REQUIRE_FINETYPE_EXT` makes the
      # tests themselves refuse to skip: delete this step and they PANIC instead of
      # quietly going back to reporting `ok` without executing.
      #
      # The artifact is whatever the community registry currently publishes for
      # `DUCKDB_VERSION` — deliberately, because that is the build a deployment
      # stages. `DUCKDB_VERSION` is the pin that fixes which one is asked for.
      - name: Stage the finetype DuckDB extension
        run: |
          set -euo pipefail
          "$HOME/duckdb/duckdb" -c "INSTALL finetype FROM community;"
          ext="$HOME/.duckdb/extensions/${DUCKDB_VERSION}/linux_amd64/finetype.duckdb_extension"
          test -f "$ext"
          {
            echo "FINETYPE_DUCKDB_EXT=$ext"
            echo "ARCFORM_REQUIRE_FINETYPE_EXT=1"
          } >> "$GITHUB_ENV"

      # `--all-targets` so the test modules are linted too, not just the binary.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # `uv` — and unlike the staticembed extension, it is cheap enough to belong on
      # the routine gate. `tests/uv_operator.rs` proves three of its four properties
      # with no `uv` at all (the two load-time refusals and the digest pin refuse
      # before anything is spawned, and the asset-graph edge runs against a stub);
      # the fourth is the operator's whole reason to exist — that a Protocol's Python
      # step gets the packages it declares whether or not the machine has them — and
      # that one cannot be stubbed. It resolves a single pure-Python wheel, so it
      # costs seconds rather than the extension build `text-embed-parity.yml` exists
      # to keep off this job.
      #
      # `--include-ignored` on that one test binary, not on the whole suite: the
      # staticembed tests stay ignored here, and their count still lands in the
      # summary below.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: test (uv operator, including the test that needs a real uv)
        run: cargo test --workspace --test uv_operator -- --include-ignored

      # tests/text_embed.rs and tests/text_embed_parity.rs carry #[ignore]d tests that
      # need a built staticembed extension, which this runner does not stage — and,
      # for the projection half, the several hundred megabytes `uv` resolves for
      # umap-learn. The `uv` installed above is not enough to turn them on, and is not
      # what keeps them off. See the module doc at the top of each file. The `test` step above already
      # reports them as `ignored` rather than `ok`, in its own `cargo test` summary;
      # this step re-runs just those two already-built binaries (nothing to recompile)
      # so that count lands in the job summary too, where a PR reader sees it without
      # opening a log.
      - name: Summarise the parity suite's routine coverage
        run: |
          set -euo pipefail
          cargo test --workspace --test text_embed --test text_embed_parity \
            2>&1 | tee "$RUNNER_TEMP/parity-routine.log"
          {
            echo "### text_embed / text_embed_parity — routine gate"
            echo
            echo "Needs a staged \`staticembed\` extension — this runner installs"
            echo "\`uv\` but stages no extension, so:"
            echo
            grep '^test result:' "$RUNNER_TEMP/parity-routine.log" | sed 's/^/- /'
            echo
            echo "Ignored here is not a pass — those tests run for real on a schedule"
            echo "and on demand, in \`text-embed-parity.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # `mcp` is off by default, so the run above compiles none of the MCP module —
      # including the tests that pin the finetype min-version gate. A gate whose test
      # never executes is not a gate, so run the suite once more with the feature on.
      # It is `cli` plus a stdio JSON-RPC loop and adds no dependencies, so this
      # recompiles one module rather than resolving a second dependency graph.
      - name: test (mcp feature)
        run: cargo test --workspace --features mcp

  # A mechanism can be added, wired in and shipped, and deleting its body leaves
  # `cargo test` green — which is how a change that does nothing reaches a merge
  # with every check above passing. This job answers the question the suite
  # cannot: if the lines this branch changed are broken on purpose, does anything
  # go red? What it reports is the function and the exact rewrite that survived,
  # never a coverage percentage — a line-coverage number goes green on a test
  # that calls a function and asserts nothing about it, which is the case this
  # exists to catch.
  #
  # SCOPED TO THE DIFF, never the crate. It mutates the lines this branch added
  # or changed under `src/` and nothing else, so a one-function change costs one
  # function's worth of mutations rather than a whole-crate run. With no changed
  # lines under `src/` it exits before it builds anything, which is why there is
  # no `paths:` filter on the job: a filtered job reports as SKIPPED, and a
  # skipped required check is indistinguishable from a passing one.
  #
  # BOUNDED, and the bound is stated rather than hoped for. MUTATION_BUDGET_SECONDS
  # caps the mutation loop at ten minutes of wall clock; whatever it did not reach
  # is printed as NOT CHECKED rather than dropped in silence. With the baseline
  # build and run in front of it the ceiling is the timeout below.
  #
  # BLOCKING, and the line it draws is about evidence. A mutation the tests
  # DEMONSTRABLY execute — proved by a second run with a `panic!` at the same
  # span, whose message has to appear in the output — and do not notice fails
  # this job. So does a mutation whose reachability could not be measured at all,
  # because "no probe compiles at this line" is a fact about the line's syntax
  # and says nothing about whether a test drives it. The way past either is a
  # test that reddens, or a ruling in
  # scripts/mutation-coverage-equivalents.txt naming why the mutation cannot
  # change behaviour — a line in the tree that can be argued with, not a flag.
  #
  # A survivor whose line no test executes is reported and does not fail the job
  # on its own (`--strict` adds it). That one IS measured: the probe compiled,
  # ran, and the line never executed, so the survivor has an established reason
  # to exist. An unmeasured survivor has none, and an absence of evidence is not
  # evidence of safety.
  mutation-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the gate diffs against the merge base with the target
      # branch, and a shallow clone has no merge base to find.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2

      # The gate's own regression test runs FIRST, for the reason the hygiene
      # workflow does the same: a checker that cannot fail is green against
      # working code and green against broken code, and the two runs look
      # identical. "This branch is clean" means nothing until "the checker still
      # bites" has been established. It builds a small crate of its own and needs
      # no DuckDB, so it reports before the download below.
      - name: mutation gate self-test
        run: python3 scripts/check-mutation-coverage-selftest.py

      # The same system DuckDB the build job provisions: the gate runs the real
      # test suite once per mutation, and the suite links libduckdb.
      - name: Install DuckDB (C library + CLI)
        run: |
          set -euo pipefail
          base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"
          mkdir -p "$HOME/duckdb"
          curl -fsSL -o /tmp/libduckdb.zip "$base/libduckdb-linux-amd64.zip"
          unzip -o /tmp/libduckdb.zip -d "$HOME/duckdb"
          curl -fsSL -o /tmp/duckdb-cli.zip "$base/duckdb_cli-linux-amd64.zip"
          unzip -o /tmp/duckdb-cli.zip -d "$HOME/duckdb"
          chmod +x "$HOME/duckdb/duckdb"
          {
            echo "DUCKDB_LIB_DIR=$HOME/duckdb"
            echo "DUCKDB_INCLUDE_DIR=$HOME/duckdb"
            echo "LD_LIBRARY_PATH=$HOME/duckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          echo "$HOME/duckdb" >> "$GITHUB_PATH"

      # The same staging as the build job, for a different reason. This gate runs the
      # suite once per mutation; a test that skips here cannot notice a mutated line,
      # so every mutation of the drift-refusal path would be reported as a survivor
      # whose line no test executes — true, and only because the extension was absent.
      - name: Stage the finetype DuckDB extension
        run: |
          set -euo pipefail
          "$HOME/duckdb/duckdb" -c "INSTALL finetype FROM community;"
          ext="$HOME/.duckdb/extensions/${DUCKDB_VERSION}/linux_amd64/finetype.duckdb_extension"
          test -f "$ext"
          {
            echo "FINETYPE_DUCKDB_EXT=$ext"
            echo "ARCFORM_REQUIRE_FINETYPE_EXT=1"
          } >> "$GITHUB_ENV"

      # The base is chosen inside the step rather than by a job-level `if:`. A
      # conditional job reports as SKIPPED, and a skipped check is
      # indistinguishable from a passing one to anything reading the run.
      - name: mutation coverage
        env:
          MUTATION_BUDGET_SECONDS: 600
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^"
          fi
          echo "diffing against $base"
          python3 scripts/check-mutation-coverage.py --base "$base"
