name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — the newest push is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Development builds link a SYSTEM DuckDB, so every job here that compiles the
  # crate without the `bundled-duckdb` feature provides the C library and its headers.
  # The `bundled` job below builds DuckDB into the binary instead, as release binaries
  # are built. One version throughout: this pin, the exact `duckdb` crate version in
  # Cargo.toml (1.10506.0 is v1.5.6) and the versions in src/vetted_extensions.json
  # move together, because arc loads extensions into the linked library in-process and
  # an extension loads only into the version it was built for. The install step below
  # writes the *_DIR / LD_LIBRARY_PATH env vars that libduckdb-sys and the test
  # runtime read.
  DUCKDB_VERSION: v1.5.6

jobs:
  # Formatting is build-free, so it reports in seconds and never waits on the
  # DuckDB download or a compile.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain: clippy's lint set moves between releases, so an
      # unpinned rustc could turn the gate red on a commit that changed nothing.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all --check

  # The Python operator scripts are shelled out to at run time, so `cargo test`
  # never executes a line of them — their own tests have to be run explicitly or
  # they are dead weight. Build-free like `fmt`, and stdlib-only (each script
  # declares `dependencies = []`), so the runner's own Python is enough: no
  # setup-python, no uv, no install step, seconds to report.
  operators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # umap_project.py runs under `uv` with umap-learn, numpy and DuckDB — none of
      # which this runner has, and the end-to-end tests that would exercise it skip
      # here for exactly that reason. So the script imports those three INSIDE
      # `main()`, and the half above them that decides things — which column types can
      # be placed on a map, how many features each contributes, the SQL quoting — is
      # importable and tested with the standard library alone. Without this step every
      # line of that script is invisible to CI.
      - name: umap_project tests
        run: python3 operators/umap_project/test_umap_project.py
      # The checkers' own regression test runs FIRST, for the same reason the hygiene
      # and mutation workflows do it: a checker is green over working prose and green
      # over broken prose, and the two runs look identical. Both defects it drives were
      # live here — a figure staled at its second site while a correct first site kept
      # the checker quiet, and a placement measurement whose two arms were one
      # measurement sitting inside the ceiling window. Stdlib-only, seconds to report.
      - name: map-refit-stability checkers still bite
        run: python3 eval/map-refit-stability/test_map_refit_findings.py

      # Stdlib-only, same reason as the step above: results.json is committed, and
      # nothing else re-checks that operators/umap_project/README.md and
      # CHANGELOG.md still say what it says. Without this, a re-run of
      # eval/map-refit-stability/measure.py that changes results.json and a prose
      # edit that does not both look clean. It also applies
      # eval/map-refit-stability/placement_bounds.py to the committed pricing JSON —
      # bounds that were price_transform.py's harness-time assertions and nothing
      # else, so no gate ever observed whether they were clearing.
      - name: map-refit-stability findings match results.json
        run: python3 eval/map-refit-stability/check_findings.py

  # The release tag guard: release.yml's first job, which every other release job
  # waits on. release.yml runs only on a pushed tag, so this is where its guard is
  # exercised before one is pushed. --wiring reads the tag filter and the guard's
  # place in the release job graph; --release-rehearsal executes the `tag-guard`
  # job's own `run:` line against a copy of this tree, once with this tree's version
  # and once for each refusal, so a version bump without its CHANGELOG.md heading
  # fails here rather than on the tag; --self-test mutates each of those and requires
  # the check to refuse. No path filter: the diffs likeliest to break the guard are a
  # version bump or an edit to release.yml, neither of which touches the script, and
  # a skipped required check passes. Stdlib-only and build-free, seconds to report.
  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Only a version tag starts a release, and the guard runs first
        run: python3 scripts/check_release_tag.py --wiring
      - name: The tag guard passes this tree's version and refuses the bad tags
        run: python3 scripts/check_release_tag.py --release-rehearsal
      - name: The tag guard detects each defect it exists for
        run: python3 scripts/check_release_tag.py --self-test
      - name: The published-fork check detects a changed source
        run: python3 scripts/check_fork_published.py --self-test

  # scripts/install.sh is what `curl … | bash` runs on a stranger's machine, and
  # release.yml sends it to the install site on every tag, so it is checked here
  # first. The self-test needs no network: target resolution for each `uname` pair,
  # the version handling, and the checksum refusal against a local file. `sh` on
  # Ubuntu is dash, the strictest POSIX shell a user is likely to have; shellcheck
  # comes with the runner image.
  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: install.sh is POSIX sh
        run: shellcheck --shell=sh scripts/install.sh
      - name: install.sh self-test
        run: sh scripts/install.sh --self-test
      - name: install.sh self-test, with an empty environment
        run: env -i PATH=/usr/bin:/bin sh scripts/install.sh --self-test

  # Clippy and the test suite both compile the crate against system DuckDB, so
  # they share a job that provisions the library once.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two commits deep, so the DuckDB preview step below can diff this commit against
      # its first parent: the base branch's tip for a pull request's merge commit, and
      # the commit before for a push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Fetch the official DuckDB C library (libduckdb.so + duckdb.h/.hpp) and
      # point the linker, the bindings build script, and the test runtime at it.
      # AND the `duckdb` CLI: arc's engine shells out to the `duckdb` binary to
      # execute a protocol's steps, so the init_from_descriptor integration test
      # (which does a real `arc run`) needs the executable on PATH — the library
      # alone links the bindings but cannot run a protocol.
      - name: Install DuckDB (C library + CLI)
        run: |
          set -euo pipefail
          base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"
          mkdir -p "$HOME/duckdb"
          curl -fsSL -o /tmp/libduckdb.zip "$base/libduckdb-linux-amd64.zip"
          unzip -o /tmp/libduckdb.zip -d "$HOME/duckdb"
          curl -fsSL -o /tmp/duckdb-cli.zip "$base/duckdb_cli-linux-amd64.zip"
          unzip -o /tmp/duckdb-cli.zip -d "$HOME/duckdb"
          chmod +x "$HOME/duckdb/duckdb"
          "$HOME/duckdb/duckdb" --version
          {
            echo "DUCKDB_LIB_DIR=$HOME/duckdb"
            echo "DUCKDB_INCLUDE_DIR=$HOME/duckdb"
            echo "LD_LIBRARY_PATH=$HOME/duckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          echo "$HOME/duckdb" >> "$GITHUB_PATH"

      # Stage the PUBLISHED finetype DuckDB extension. Without it the
      # `finetype_validate` tests — the ones that drive a real refusal and read the
      # message it hands the operator — return early and report as `ok`, which is
      # indistinguishable from having run. This is one `INSTALL ... FROM community`
      # of a ~14 MB artifact, not a second repo's build, so it belongs on the routine
      # gate rather than in a scheduled workflow the way `subtoken` does.
      #
      # `test -f` makes a registry that served nothing a red step here rather than a
      # silent skip three steps later, and `ARCFORM_REQUIRE_FINETYPE_EXT` makes the
      # tests themselves refuse to skip: delete this step and they PANIC instead of
      # quietly going back to reporting `ok` without executing.
      #
      # The artifact is whatever the community registry currently publishes for
      # `DUCKDB_VERSION` — deliberately, because that is the build a deployment
      # stages. `DUCKDB_VERSION` is the pin that fixes which one is asked for.
      - name: Stage the finetype DuckDB extension
        run: |
          set -euo pipefail
          "$HOME/duckdb/duckdb" -c "INSTALL finetype FROM community;"
          ext="$HOME/.duckdb/extensions/${DUCKDB_VERSION}/linux_amd64/finetype.duckdb_extension"
          test -f "$ext"
          {
            echo "FINETYPE_DUCKDB_EXT=$ext"
            echo "ARCFORM_REQUIRE_FINETYPE_EXT=1"
          } >> "$GITHUB_ENV"

      # `ducklake_publish` runs `INSTALL ducklake` itself, and its credential tests
      # create an `s3` secret, which autoloads `httpfs`. Staging both here is not what
      # makes those tests pass: it turns a registry that serves nothing into a red step
      # rather than a failure inside the suite, and it keeps the suite's concurrent
      # tests from each downloading the same extension at once on a cold runner.
      - name: Stage the ducklake and httpfs DuckDB extensions
        run: |
          set -euo pipefail
          "$HOME/duckdb/duckdb" -c "INSTALL ducklake; INSTALL httpfs;"
          dir="$HOME/.duckdb/extensions/${DUCKDB_VERSION}/linux_amd64"
          test -f "$dir/ducklake.duckdb_extension"
          test -f "$dir/httpfs.duckdb_extension"

      # `--all-targets` so the test modules are linted too, not just the binary.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `default = ["cli"]` in Cargo.toml, so the step above compiles — and lints —
      # none of src/mcp/ and none of the code behind `opendal`: a warning there
      # would reach main with the clippy step green. The non-default features are the
      # ones `[features]` defines that `default` does not reach through `cli` and
      # `http-fetch`: `mcp` and `opendal`. This lints both at once, so the
      # `opendal` dependency graph is resolved once. The default run above stays:
      # it is the only one that lints the `cfg(not(feature = "opendal"))` code.
      - name: clippy (mcp, opendal features)
        run: cargo clippy --workspace --all-targets --features mcp,opendal -- -D warnings

      - name: test
        run: cargo test --workspace

      # The reader in src/duckdb_lineage.rs asks a DuckDB 2.0 build for its parse of a
      # step, and DUCKDB_VERSION above is a 1.x release, so its tests that start DuckDB
      # are #[ignore]d and the step above reports them as ignored, as are the tests of
      # `arc run` with ARC_SQL_READER=duckdb in tests/duckdb_reader_switch.rs. This step
      # downloads the 2.0 preview and runs both when this commit changes the reader, the
      # rules src/introspect.rs applies to what it reads, those tests or this workflow;
      # the tests that read from captured answers ran above either way. The preview's
      # address names no version and the build behind it moves, so a change elsewhere
      # does not run them. The step prints the version it downloaded, and each lib test
      # prints the version it asked.
      - name: test (DuckDB lineage reader, on the DuckDB 2.0 preview)
        run: |
          set -euo pipefail
          watched="src/duckdb_lineage.rs src/introspect.rs tests/duckdb_reader_switch.rs .github/workflows/ci.yml"
          changed=$(git diff --name-only HEAD^1 HEAD -- $watched)
          if [ -z "$changed" ]; then
            echo "$watched are unchanged; the preview tests do not run."
            exit 0
          fi
          dir="$RUNNER_TEMP/duckdb-preview"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/cli.tar.gz" \
            https://artifacts.duckdb.org/v2.0-cyanoptera/duckdb-cli-linux-amd64.tar.gz
          tar -xzf "$dir/cli.tar.gz" -C "$dir"
          "$dir/duckdb" --version
          ARC_DUCKDB_PREVIEW_BIN="$dir/duckdb" \
            cargo test --workspace --lib duckdb_lineage -- --include-ignored --nocapture
          ARC_DUCKDB_PREVIEW_BIN="$dir/duckdb" \
            cargo test --workspace --test duckdb_reader_switch -- --include-ignored

      # `uv` — and unlike the subtoken extension, it is cheap enough to belong on
      # the routine gate. `tests/uv_operator.rs` proves three of its four properties
      # with no `uv` at all (the two load-time refusals and the digest pin refuse
      # before anything is spawned, and the asset-graph edge runs against a stub);
      # the fourth is the operator's whole reason to exist — that a Protocol's Python
      # step gets the packages it declares whether or not the machine has them — and
      # that one cannot be stubbed. It resolves a single pure-Python wheel, so it
      # costs seconds rather than the extension build `text-embed-parity.yml` exists
      # to keep off this job.
      #
      # `--include-ignored` on that one test binary, not on the whole suite: the
      # subtoken tests stay ignored here, and their count still lands in the
      # summary below.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: test (uv operator, including the test that needs a real uv)
        run: cargo test --workspace --test uv_operator -- --include-ignored

      # `umap_project --fit` end to end, and it has to be here rather than in the
      # `operators` job because it runs a real projection: UMAP, numpy and DuckDB under
      # `uv`, which that job deliberately has none of. What it pins is the one thing the
      # stdlib suite cannot reach — that a row already on the map comes back with the
      # SAME float after rows are appended — and a bookkeeping test is green whether or
      # not the stored coordinates were ever used. Eight invocations share one process
      # so numba JIT-compiles UMAP once: ~200s locally, against roughly a quarter of an
      # hour spawning each. The step above has already resolved this dependency set.
      - name: umap_project persisted-fit end to end
        run: uv run operators/umap_project/test_umap_project_fit.py

      # tests/text_embed.rs and tests/text_embed_parity.rs carry #[ignore]d tests that
      # need a built subtoken extension, which this runner does not stage — and,
      # for the projection half, the several hundred megabytes `uv` resolves for
      # umap-learn. The `uv` installed above is not enough to turn them on, and is not
      # what keeps them off. See the module doc at the top of each file. The `test` step above already
      # reports them as `ignored` rather than `ok`, in its own `cargo test` summary;
      # this step re-runs just those two already-built binaries (nothing to recompile)
      # so that count lands in the job summary too, where a PR reader sees it without
      # opening a log.
      - name: Summarise the parity suite's routine coverage
        run: |
          set -euo pipefail
          cargo test --workspace --test text_embed --test text_embed_parity \
            2>&1 | tee "$RUNNER_TEMP/parity-routine.log"
          {
            echo "### text_embed / text_embed_parity — routine gate"
            echo
            echo "Needs a staged \`subtoken\` extension — this runner installs"
            echo "\`uv\` but stages no extension, so:"
            echo
            grep '^test result:' "$RUNNER_TEMP/parity-routine.log" | sed 's/^/- /'
            echo
            echo "Ignored here is not a pass — those tests run for real on a schedule"
            echo "and on demand, in \`text-embed-parity.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # `mcp` is off by default, so the run above compiles none of the MCP module —
      # including the tests that pin the finetype min-version gate. A gate whose test
      # never executes is not a gate, so run the suite once more with the feature on.
      # It is `cli` plus a stdio JSON-RPC loop and adds no dependencies, so this
      # recompiles one module rather than resolving a second dependency graph.
      - name: test (mcp feature)
        run: cargo test --workspace --features mcp

  # What crates.io would receive, checked on every pull request so a packaging fault
  # shows before a tag. arcform is published as `arcform`, and depends on its sqlparser
  # fork published as `arcform-sqlparser`. The fork is not a workspace member (that
  # would put upstream's code under this repo's `--workspace` clippy and test gates),
  # so it is addressed by its manifest path rather than `-p`.
  #
  # Until `arcform-sqlparser` is on crates.io, `cargo publish --dry-run -p arcform`
  # cannot resolve it, so the last step builds what `cargo package` produces for
  # arcform against what it produces for the fork: both .crate files unpacked, the
  # fork patched in for the crates.io dependency, and `cargo check` run on the
  # unpacked arcform. That catches an `include` list that leaves out a file the
  # source embeds with `include_str!`, which the `--list` step alone would not.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          key: package

      # `cargo check` links nothing, but libduckdb-sys's build script still looks for
      # the library, so it gets the same one the `build` job uses.
      - name: Install the DuckDB C library
        run: |
          set -euo pipefail
          base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"
          mkdir -p "$HOME/duckdb"
          curl -fsSL -o /tmp/libduckdb.zip "$base/libduckdb-linux-amd64.zip"
          unzip -o /tmp/libduckdb.zip -d "$HOME/duckdb"
          {
            echo "DUCKDB_LIB_DIR=$HOME/duckdb"
            echo "DUCKDB_INCLUDE_DIR=$HOME/duckdb"
          } >> "$GITHUB_ENV"

      # arcform pins the fork with `=x.y.z`, and the path dependency builds this
      # checkout whatever that says, so a fork bumped in one manifest and not the other
      # would pass every other job and fail only at publish. This step enforces that
      # the two manifests agree; it does not notice a source edit without a bump. The
      # next step does.
      - name: The fork's version is the one arcform pins
        run: |
          python3 - <<'PY'
          import sys, tomllib
          with open("Cargo.toml", "rb") as f:
              wanted = tomllib.load(f)["dependencies"]["sqlparser"]["version"].removeprefix("=")
          with open("vendor/sqlparser-0.55.0/Cargo.toml", "rb") as f:
              have = tomllib.load(f)["package"]["version"]
          if have != wanted:
              print(f"::error::arcform pins arcform-sqlparser ={wanted} but the fork is {have}; "
                    "bump both together: the fork's [package] version and arcform's sqlparser dependency")
              sys.exit(1)
          print(f"arcform-sqlparser {have} matches arcform's pin")
          PY

      # When the fork's version is already on crates.io, the published crate must be
      # this tree's fork, file for file (the files cargo writes itself aside), or the
      # release would skip publishing it and ship arcform against the old source.
      # Before the version is published there is nothing to compare, and it passes.
      - name: A published fork version is this tree's fork source
        run: python3 scripts/check_fork_published.py --manifest-path vendor/sqlparser-0.55.0/Cargo.toml

      - name: arcform-sqlparser publishes (dry run)
        run: cargo publish --dry-run --manifest-path vendor/sqlparser-0.55.0/Cargo.toml --features visitor

      # The list is printed for the log, then held to the `include` rule: the source,
      # the embedded operator scripts, build.rs and the skills it embeds, and the
      # top-level documents, and nothing else —
      # no fixture, no example database, no vendored fork.
      - name: arcform's package contents
        run: |
          set -euo pipefail
          cargo package -p arcform --list | tee /tmp/arcform-files
          if grep -Ev '^(src/|build\.rs$|skills/|operators/[a-z_]+/[a-z_]+\.py$|Cargo\.toml$|Cargo\.toml\.orig$|Cargo\.lock$|README\.md$|CHANGELOG\.md$|LICENSE$|\.cargo_vcs_info\.json$)' /tmp/arcform-files; then
            echo "::error::files above are outside arcform's include rule"
            exit 1
          fi

      - name: Packaged arcform builds against the packaged fork
        run: |
          set -euo pipefail
          cargo package --manifest-path vendor/sqlparser-0.55.0/Cargo.toml --no-verify
          cargo package -p arcform --no-verify --exclude-lockfile
          size=$(wc -c < target/package/arcform-*.crate)
          echo "arcform .crate: $size bytes"
          test "$size" -lt 10000000
          work="$RUNNER_TEMP/packaged"
          mkdir -p "$work"
          tar -xzf vendor/sqlparser-0.55.0/target/package/arcform-sqlparser-*.crate -C "$work"
          tar -xzf target/package/arcform-*.crate -C "$work"
          fork=$(ls -d "$work"/arcform-sqlparser-*)
          crate=$(ls -d "$work"/arcform-[0-9]*)
          printf '\n[patch.crates-io]\narcform-sqlparser = { path = "%s" }\n' "$fork" >> "$crate/Cargo.toml"
          cp Cargo.lock "$crate/"
          cargo check --manifest-path "$crate/Cargo.toml" --features mcp --target-dir target/packaged
          cargo check --manifest-path "$crate/Cargo.toml" --no-default-features --target-dir target/packaged

  # The binary a release ships: DuckDB compiled in (`bundled-duckdb`, with the
  # parquet and json extensions), no system libduckdb, built --release on the
  # Ubuntu 22.04 the Linux release legs use, so glibc 2.35 is what it is tested on.
  # It runs the suite against that binary on every pull request, so a tag never ships
  # a build no test has run. DUCKDB_LIB_DIR is deliberately absent: were it set, the
  # tests could pass against the system library and say nothing about the bundled one.
  bundled:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      # Keyed on the feature set, so this job's compiled DuckDB never shares a cache
      # entry with the dynamic build's target directory.
      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-bundled-duckdb

      # The `duckdb` command line only, no C library: arc's engine shells out to it to
      # run a protocol's SQL steps, which the bundled build does not change.
      - name: Install the DuckDB CLI
        run: |
          set -euo pipefail
          base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"
          mkdir -p "$HOME/duckdb"
          curl -fsSL -o /tmp/duckdb-cli.zip "$base/duckdb_cli-linux-amd64.zip"
          unzip -o /tmp/duckdb-cli.zip -d "$HOME/duckdb"
          chmod +x "$HOME/duckdb/duckdb"
          "$HOME/duckdb/duckdb" --version
          echo "$HOME/duckdb" >> "$GITHUB_PATH"

      # As in the build job: the finetype tests load this extension into the linked
      # library in-process, which here is the bundled one, so they prove the bundled
      # DuckDB is the version the extension was built for. ARCFORM_REQUIRE_FINETYPE_EXT
      # makes them panic rather than skip if the staging goes missing.
      - name: Stage the finetype, ducklake and httpfs DuckDB extensions
        run: |
          set -euo pipefail
          "$HOME/duckdb/duckdb" -c "INSTALL finetype FROM community; INSTALL ducklake; INSTALL httpfs;"
          dir="$HOME/.duckdb/extensions/${DUCKDB_VERSION}/linux_amd64"
          test -f "$dir/finetype.duckdb_extension"
          test -f "$dir/ducklake.duckdb_extension"
          test -f "$dir/httpfs.duckdb_extension"
          {
            echo "FINETYPE_DUCKDB_EXT=$dir/finetype.duckdb_extension"
            echo "ARCFORM_REQUIRE_FINETYPE_EXT=1"
          } >> "$GITHUB_ENV"

      # --locked, as release.yml builds: a version bump whose Cargo.lock was not
      # updated fails here, on the pull request, rather than on every leg of the tag.
      - name: test (release, mcp + bundled-duckdb)
        run: |
          set -euo pipefail
          test -z "${DUCKDB_LIB_DIR:-}"
          cargo test --release --locked --features mcp,bundled-duckdb

      # The binary itself, not just the test harness: it starts, and it names no
      # libduckdb among the shared libraries it needs.
      - name: the release binary carries DuckDB
        run: |
          set -euo pipefail
          cargo build --release --locked --features mcp,bundled-duckdb
          ./target/release/arc --version
          if ldd target/release/arc | grep -i duckdb; then
            echo "target/release/arc links a shared libduckdb" >&2
            exit 1
          fi

  # A mechanism can be added, wired in and shipped, and deleting its body leaves
  # `cargo test` green — which is how a change that does nothing reaches a merge
  # with every check above passing. This job answers the question the suite
  # cannot: if the lines this branch changed are broken on purpose, does anything
  # go red? What it reports is the function and the exact rewrite that survived,
  # never a coverage percentage — a line-coverage number goes green on a test
  # that calls a function and asserts nothing about it, which is the case this
  # exists to catch.
  #
  # SCOPED TO THE DIFF, never the crate. It mutates the lines this branch added
  # or changed under `src/` and nothing else, so a one-function change costs one
  # function's worth of mutations rather than a whole-crate run. With no changed
  # lines under `src/` it exits before it builds anything, which is why there is
  # no `paths:` filter on the job: a filtered job reports as SKIPPED, and a
  # skipped required check is indistinguishable from a passing one.
  #
  # BOUNDED, and the bound is stated rather than hoped for. MUTATION_BUDGET_SECONDS
  # caps the mutation loop at ten minutes of wall clock; whatever it did not reach
  # is printed as NOT CHECKED rather than dropped in silence. With the baseline
  # build and run in front of it the ceiling is the timeout below.
  #
  # BLOCKING, and the line it draws is about evidence. A mutation the tests
  # DEMONSTRABLY execute — proved by a second run with a `panic!` at the same
  # span, whose message has to appear in the output — and do not notice fails
  # this job. So does a mutation whose reachability could not be measured at all,
  # because "no probe compiles at this line" is a fact about the line's syntax
  # and says nothing about whether a test drives it. The way past either is a
  # test that reddens, or a ruling in
  # scripts/mutation-coverage-equivalents.txt naming why the mutation cannot
  # change behaviour — a line in the tree that can be argued with, not a flag.
  #
  # A survivor whose line no test executes is reported and does not fail the job
  # on its own (`--strict` adds it). That one IS measured: the probe compiled,
  # ran, and the line never executed, so the survivor has an established reason
  # to exist. An unmeasured survivor has none, and an absence of evidence is not
  # evidence of safety.
  mutation-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the gate diffs against the merge base with the target
      # branch, and a shallow clone has no merge base to find.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2

      # The gate's own regression test runs FIRST, for the reason the hygiene
      # workflow does the same: a checker that cannot fail is green against
      # working code and green against broken code, and the two runs look
      # identical. "This branch is clean" means nothing until "the checker still
      # bites" has been established. It builds a small crate of its own and needs
      # no DuckDB, so it reports before the download below.
      - name: mutation gate self-test
        run: python3 scripts/check-mutation-coverage-selftest.py

      # The same system DuckDB the build job provisions: the gate runs the real
      # test suite once per mutation, and the suite links libduckdb.
      - name: Install DuckDB (C library + CLI)
        run: |
          set -euo pipefail
          base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"
          mkdir -p "$HOME/duckdb"
          curl -fsSL -o /tmp/libduckdb.zip "$base/libduckdb-linux-amd64.zip"
          unzip -o /tmp/libduckdb.zip -d "$HOME/duckdb"
          curl -fsSL -o /tmp/duckdb-cli.zip "$base/duckdb_cli-linux-amd64.zip"
          unzip -o /tmp/duckdb-cli.zip -d "$HOME/duckdb"
          chmod +x "$HOME/duckdb/duckdb"
          {
            echo "DUCKDB_LIB_DIR=$HOME/duckdb"
            echo "DUCKDB_INCLUDE_DIR=$HOME/duckdb"
            echo "LD_LIBRARY_PATH=$HOME/duckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          echo "$HOME/duckdb" >> "$GITHUB_PATH"

      # The same staging as the build job, for a different reason. This gate runs the
      # suite once per mutation; a test that skips here cannot notice a mutated line,
      # so every mutation of the drift-refusal path would be reported as a survivor
      # whose line no test executes — true, and only because the extension was absent.
      - name: Stage the finetype DuckDB extension
        run: |
          set -euo pipefail
          "$HOME/duckdb/duckdb" -c "INSTALL finetype FROM community;"
          ext="$HOME/.duckdb/extensions/${DUCKDB_VERSION}/linux_amd64/finetype.duckdb_extension"
          test -f "$ext"
          {
            echo "FINETYPE_DUCKDB_EXT=$ext"
            echo "ARCFORM_REQUIRE_FINETYPE_EXT=1"
          } >> "$GITHUB_ENV"

      # `ducklake_publish` runs `INSTALL ducklake` itself, and its credential tests
      # create an `s3` secret, which autoloads `httpfs`. Staging both here is not what
      # makes those tests pass: it turns a registry that serves nothing into a red step
      # rather than a failure inside the suite, and it keeps the suite's concurrent
      # tests from each downloading the same extension at once on a cold runner.
      - name: Stage the ducklake and httpfs DuckDB extensions
        run: |
          set -euo pipefail
          "$HOME/duckdb/duckdb" -c "INSTALL ducklake; INSTALL httpfs;"
          dir="$HOME/.duckdb/extensions/${DUCKDB_VERSION}/linux_amd64"
          test -f "$dir/ducklake.duckdb_extension"
          test -f "$dir/httpfs.duckdb_extension"

      # The base is chosen inside the step rather than by a job-level `if:`. A
      # conditional job reports as SKIPPED, and a skipped check is
      # indistinguishable from a passing one to anything reading the run.
      - name: mutation coverage
        env:
          MUTATION_BUDGET_SECONDS: 600
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^"
          fi
          echo "diffing against $base"
          python3 scripts/check-mutation-coverage.py --base "$base"
