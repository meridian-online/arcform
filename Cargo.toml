[package]
name = "arc"
version = "0.1.0"
edition = "2024"
description = "Local-first data pipeline engine for analytical workflows"
license = "MIT"

# The library target. `arc` is a binary first, but the spec it runs is now also
# consumed by sibling Rust tools that must not reimplement the schema — they link
# this crate and call the real loader. With `default-features = false` the crate
# root exports `spec` and nothing else; the default `cli` feature adds one further
# root item, the doc-hidden `cli_main` the binary shim calls. Both shapes are
# enumerated by `tests/public_surface.rs`, which fails the build if either widens.
[lib]
name = "arc"
path = "src/lib.rs"

# Needs `cli`, so `--no-default-features` builds the library alone.
[[bin]]
name = "arc"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
dotenvy = "0.15"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
owo-colors = "4"
sqlparser = { version = "0.55", features = ["visitor"] }
duckdb = "1.2"
semver = "1"
sha2 = "0.10"
humantime = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
tar = "0.4"
flate2 = "1"
dirs = "5"
# html_link_discover href-plucking + archive_extract member selection.
regex = "1"
# archive_extract: unzip the DEFLATE-compressed SEC N-CEN quarter zips. MUST be
# `deflate-flate2` (wires the flate2 inflate backend — already an arcform dep),
# NOT plain `deflate` (a base meta-feature with no backend → runtime failure on
# the compressed members). default-features OFF drops the bzip2/zstd/aes C backends.
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
# opendal_fetch (ingress): one operator, 40+ backends + built-in RetryLayer —
# the s3://securelake / multi-store lever. HEAVY: +156 crates (tokio, hyper,
# tower, reqwest, rustls) that the ureq http_fetch path needs none of. Feature-
# gated OFF by default so the flagship single binary stays lean; build with
# `--features opendal` to include it.
opendal = { version = "0.58", features = ["services-http", "services-s3", "blocking"], optional = true }
# Custom HTTP transport so opendal_fetch can carry request headers (User-Agent) —
# OpenDAL's Http builder has no header setter; you inject a reqwest client via a
# ReqwestTransport. reqwest 0.13 is version-matched to OpenDAL's transport.
opendal-http-transport-reqwest = { version = "0.58", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }
# The spec write path's span source: format-preserving YAML feature extraction on
# tree-sitter node byte-spans (`src/edit.rs` splices raw bytes at those spans and
# never re-serialises, which is how a hand-authored spec survives a machine edit).
# Pinned exact: 1.28.0 pulls a transitive dep whose MSRV (1.97) is above the CI
# toolchain pin — bump both together, deliberately.
yamlpath = "=1.27.0"

[features]
default = ["cli"]
# The `arc` command line: the clap parser, the command dispatch, and the `cli_main`
# entry point the binary shim calls. On by default so `cargo build` still produces
# the binary. A library consumer turns it off — `cli_main` reads the *caller's* argv
# and can exit the caller's process, so it has no business being reachable from a
# crate that only wants the spec loader.
cli = ["dep:clap"]
# The OpenDAL-backed opendal_fetch operator (multi-backend ingress; securelake s3://).
opendal = ["dep:opendal", "dep:opendal-http-transport-reqwest", "dep:reqwest", "dep:tokio"]
# The `arc mcp` entry point: a Model Context Protocol server over stdio that
# federates the `finetype` CLI as tools and exposes protocol-run + operator-describe.
# Gated OFF by default (like `opendal`) so the flagship binary stays lean and pulls
# no MCP/agent machinery unless asked; enable with `--features mcp`. Pulls in `cli`
# because the entry point is an `arc mcp` subcommand. Deliberately dependency-free —
# it speaks JSON-RPC 2.0 over stdio with the `serde_json` already in the graph.
mcp = ["cli"]

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

# Vendored sqlparser: a local fork of sqlparser 0.55.0 that teaches the DuckDB
# dialect two grammars the published crate rejects — statement-form PIVOT/UNPIVOT
# (`PIVOT t ON … USING …`) and multi-option COPY (`COPY … TO 'f' (FORMAT parquet,
# COMPRESSION zstd)`). Without these, SQL introspection degrades those steps to
# opaque nodes (the opposite of structural transparency). The fork is
# minimal and version-pinned to 0.55.0 so the patch applies cleanly and the dep graph
# is unchanged. Upstreaming is the maintenance path — see
# vendor/sqlparser-0.55.0/MERIDIAN_PATCH.md for the diff summary + draft PR text.
[patch.crates-io]
sqlparser = { path = "vendor/sqlparser-0.55.0" }
