[package]
name = "arcform"
version = "0.2.0"
edition = "2024"
description = "Local-first data pipeline engine for analytical workflows"
license = "MIT"
repository = "https://github.com/meridian-online/arcform"
homepage = "https://meridian.online"
readme = "README.md"
keywords = ["pipeline", "duckdb", "sql", "data", "etl"]
categories = ["command-line-utilities", "database"]
# What crates.io receives: the source, the operator scripts `src/operator.rs` embeds
# with `include_str!`, `build.rs` and the agent skills under `skills/` it embeds (so
# `arc skills install` works from the published crate), and the top-level documents.
# Everything else stays out — the 40 MB examples/brewtrend/trends.db, the test
# fixtures (only `#[cfg(test)]` code embeds them, and the packaged crate is never
# tested), the vendored sqlparser fork (published as its own crate,
# `arcform-sqlparser`), and the docs and evals. An `include_str!` added outside src/
# must be added here too, or the published crate stops compiling; CI's `package` job
# catches that before a tag. The leading `/` anchors a name to the crate root:
# without it `README.md` would match every README in the tree.
include = [
    "/src/**",
    "/build.rs",
    "/skills/**",
    "/operators/gleif_ra_fetch/fetch_gleif_ra.py",
    "/operators/splink_resolve/resolve.py",
    "/operators/text_embed/text_embed.py",
    "/operators/umap_project/umap_project.py",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# The library target. arcform is a binary first, but the spec it runs is now also
# consumed by sibling Rust tools that must not reimplement the schema — they link
# this crate and call the real loader. With `default-features = false` the crate
# root exports `spec` and nothing else; the default `cli` feature adds one further
# root item, the doc-hidden `cli_main` the binary shim calls. Both shapes are
# enumerated by `tests/public_surface.rs`, which fails the build if either widens.
[lib]
name = "arcform"
path = "src/lib.rs"

# Needs `cli`, so `--no-default-features` builds the library alone.
[[bin]]
name = "arc"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
dotenvy = "0.15"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
owo-colors = "4"
# arcform's sqlparser fork: sqlparser 0.55.0, taught the DuckDB grammars the published
# crate rejects — statement-form PIVOT/UNPIVOT (`PIVOT t ON … USING …`), multi-option
# COPY (`COPY … TO 'f' (FORMAT parquet, COMPRESSION zstd)`), the `lambda x: expr`
# colon-form lambda, `INSTALL … FROM <repository>` / `FORCE INSTALL`, an empty-string
# COPY option (`QUOTE ''`), a `PRAGMA` call with several arguments, and
# `SET VARIABLE <name> = <expr>`. Without them SQL introspection degrades those steps
# to opaque nodes. Published as `arcform-sqlparser` so the arcform crate resolves from
# crates.io alone; its library keeps the name `sqlparser`, so the source says
# `use sqlparser::…` as before. The path builds this checkout against the fork as it
# stands; the exact version is what the published arcform asks crates.io for, and a
# change to the fork bumps its patch number here and in its own Cargo.toml together.
# Upstreaming is the maintenance path — vendor/sqlparser-0.55.0/MERIDIAN_PATCH.md
# holds the diff summary and draft PR text.
sqlparser = { package = "arcform-sqlparser", version = "=0.55.0", path = "vendor/sqlparser-0.55.0", features = ["visitor"] }
# Pinned exact: arc loads DuckDB extensions (finetype among them) into this library
# in-process, and an extension loads only into the DuckDB version it was built for.
# 1.20000.0 is DuckDB v2.0.0. Bump in lockstep with `DUCKDB_VERSION` in
# .github/workflows/ci.yml and the versions in src/vetted_extensions.json.
duckdb = "=1.20000.0"
semver = "1"
sha2 = "0.10"
humantime = "2"
# The ureq-backed HTTP ingress path: the `http_fetch` + `html_link_discover`
# operators and the `fresh` precondition's remote HEAD probe (blocking, http/https,
# rustls TLS). It is reachable ONLY while a pipeline runs, and a pipeline runs ONLY
# through the `arc` CLI — the published library surface is `spec` alone (src/lib.rs),
# so a crate that links arc with `default-features = false` (e.g. brightfield's
# desktop shell, which wants only the spec loader) can neither reach nor needs it.
# Optional + gated behind `http-fetch` (pulled in by `cli`), so a no-CLI consumer
# drops ureq — and, being ureq's sole runtime consumer, its whole rustls/ring TLS
# stack — out of the binary. Reachability note lives beside the operator in
# src/operator.rs.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
# `http_fetch` follows redirects itself (ureq discards every hop's headers but the
# last), so it needs ureq's own `Url::join` to resolve a relative `Location`.
# ureq depends on this crate unconditionally, so the gated dep adds nothing to the
# graph that `http-fetch` does not already pull in.
url = { version = "2", optional = true }
tar = "0.4"
flate2 = "1"
dirs = "5"
# html_link_discover href-plucking + archive_extract member selection.
regex = "1"
# archive_extract: unzip the DEFLATE-compressed SEC N-CEN quarter zips. MUST be
# `deflate-flate2` (wires the flate2 inflate backend — already an arcform dep),
# NOT plain `deflate` (a base meta-feature with no backend → runtime failure on
# the compressed members). default-features OFF drops the bzip2/zstd/aes C backends.
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
# opendal_fetch (ingress): one operator, 40+ backends + built-in RetryLayer —
# the s3://securelake / multi-store lever. HEAVY: +156 crates (tokio, hyper,
# tower, reqwest, rustls) that the ureq http_fetch path needs none of. Feature-
# gated OFF by default so the flagship single binary stays lean; build with
# `--features opendal` to include it.
opendal = { version = "0.58", features = ["services-http", "services-s3", "blocking"], optional = true }
# Custom HTTP transport so opendal_fetch can carry request headers (User-Agent) —
# OpenDAL's Http builder has no header setter; you inject a reqwest client via a
# ReqwestTransport. reqwest 0.13 is version-matched to OpenDAL's transport.
opendal-http-transport-reqwest = { version = "0.58", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }
# The spec write path's span source: format-preserving YAML feature extraction on
# tree-sitter node byte-spans (`src/edit.rs` splices raw bytes at those spans and
# never re-serialises, which is how a hand-authored spec survives a machine edit).
# Pinned exact: 1.28.0 pulls a transitive dep whose MSRV (1.97) is above the CI
# toolchain pin — bump both together, deliberately.
yamlpath = "=1.27.0"

[features]
default = ["cli"]
# The `arc` command line: the clap parser, the command dispatch, and the `cli_main`
# entry point the binary shim calls. On by default so `cargo build` still produces
# the binary. A library consumer turns it off — `cli_main` reads the *caller's* argv
# and can exit the caller's process, so it has no business being reachable from a
# crate that only wants the spec loader. Pulls in `http-fetch`: the engine only ever
# runs a pipeline via the CLI, so the ingress operators ride with it and the shipped
# binary is always whole.
cli = ["dep:clap", "http-fetch"]
# The ureq-backed HTTP ingress path — the `http_fetch` + `html_link_discover`
# operators and the `fresh` precondition's HEAD probe. Enabled via `cli` (never
# reachable without a running pipeline, which is a CLI-only operation), so a
# `default-features = false` library consumer builds without ureq and its
# rustls/ring TLS stack. Kept a *named* feature distinct from `cli` so a future
# engine-as-library consumer could opt the fetch path back in without the clap
# argv parser.
http-fetch = ["dep:ureq", "dep:url"]
# The OpenDAL-backed opendal_fetch operator (multi-backend ingress; securelake s3://).
opendal = ["dep:opendal", "dep:opendal-http-transport-reqwest", "dep:reqwest", "dep:tokio"]
# The `arc mcp` entry point: a Model Context Protocol server over stdio that
# federates the `finetype` CLI as tools and adds arc's own (the set is in src/mcp).
# Gated OFF by default (like `opendal`) so the flagship binary stays lean and pulls
# no MCP/agent machinery unless asked; enable with `--features mcp`. Pulls in `cli`
# because the entry point is an `arc mcp` subcommand. Deliberately dependency-free —
# it speaks JSON-RPC 2.0 over stdio with the `serde_json` already in the graph.
mcp = ["cli"]
# Compile DuckDB into the binary instead of linking the system libduckdb, with the
# parquet and json extensions: arc reads parquet in-process, and the plain `bundled`
# build leaves both out. ICU, the third extension the official library carries, is
# not compiled in: the crate builds it only through its CMake backend
# (`bundled-cmake`), which works from a duckdb-rs git checkout and not from the
# crates.io package (whose sources carry core_functions, json and parquet alone), so
# `cargo install` could not build it. A query that needs ICU, such as `AT TIME ZONE`,
# loads `icu` from DuckDB's extension directory when `INSTALL icu` has put it there;
# where it has not, DuckDB's error names `INSTALL icu`.
# Release binaries are built with `--features mcp,bundled-duckdb`. Off by default: a
# cold build compiles DuckDB's C++ and takes tens of minutes, so everyday development
# links the system library through `DUCKDB_LIB_DIR`.
bundled-duckdb = ["duckdb/bundled", "duckdb/parquet", "duckdb/json"]

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
# Already a dependency; named here so `tests/uv_operator.rs` can compute the digest a
# `uv@1` step pins rather than hard-coding one into a fixture that would then rot.
sha2 = "0.10"
